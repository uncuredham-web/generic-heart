<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ゴーレムビルダー | ジェネリックハート</title>
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/builder.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-area">
        <div>
          <h1 class="brand-title">ゴーレムビルダー</h1>
          <p class="brand-subtitle">胴体・頭部・腕部・脚部・武装を組み合わせて機体を設計</p>
        </div>
      </div>
      <nav class="nav-links" aria-label="画面切り替え">
        <a class="nav-link" href="./index.html">ポータル</a>
        <a class="nav-link is-active" href="./builder.html">ゴーレムビルダー</a>
        <a class="nav-link" href="./arena.html">ゴーレムアリーナ</a>
      </nav>
    </div>
  </header>

  <main class="builder-container">
    <div class="status-bar">
      <div>
        <span id="data-status" class="status-badge is-fallback">「ジェネリックハート_パーツマスター_Ver1.1」読込待機中...</span>
      </div>
      <button id="reload-data-btn" type="button" class="btn btn-secondary btn-sm">
        マスターデータ再読込
      </button>
    </div>

    <div id="master-error" class="panel" style="display:none; border-color:var(--danger); color:#fca5a5; margin-bottom:20px;" role="alert"></div>

    <div class="builder-3col">
      <!-- 左カラム：ビルドJSON取込・保存済み機体 -->
      <aside class="panel builder-left-col">
        <div class="json-import-box">
          <h2 class="panel-title">ビルドJSON取込</h2>
          <label for="import-json-textarea" class="muted" style="display:block;margin-bottom:6px;">
            JSONを貼り付けて取り込み
          </label>
          <textarea
            id="import-json-textarea"
            class="json-import-textarea"
            placeholder='{"name":"機体名","parts":{"core":"C01",...},"tactic":"確実に当てて押し切れ"}'
          ></textarea>
          <button id="import-json-btn" type="button" class="btn btn-secondary btn-sm">JSONを取込</button>
        </div>

        <h2 class="panel-title" style="margin-top:18px;">保存済み機体</h2>
        <div id="saved-list" class="saved-list"></div>
      </aside>

      <!-- 中央カラム：ビルドのメインブロック -->
      <section class="panel builder-main-col">
        <h2 class="panel-title">1. 基本設定・プリセット</h2>

        <div class="form-row">
          <div>
            <label for="golem-name">機体名</label>
            <input id="golem-name" type="text" maxlength="32" placeholder="機体名を入力" />
          </div>
          <div>
            <label for="tactic-select">さくせん</label>
            <select id="tactic-select"></select>
          </div>
        </div>

        <div class="form-group">
          <label for="preset-select">プリセット機体から読込</label>
          <div style="display:flex;gap:8px;">
            <select id="preset-select"></select>
            <button id="apply-preset-btn" type="button" class="btn btn-secondary">反映</button>
          </div>
        </div>

        <h2 class="panel-title" style="margin-top:20px;">2. 胴体（核）</h2>
        <div id="core-list" class="part-list"></div>

        <h2 class="panel-title" style="margin-top:20px;">3. 頭部</h2>
        <div id="head-list" class="part-list"></div>

        <h2 class="panel-title" style="margin-top:22px;">4. 右腕</h2>
        <div id="right-arm-section">
          <h3 class="sub-block-title">右腕パーツ</h3>
          <div id="right-arm-list" class="part-list"></div>
          <div id="right-weapon-block">
            <h3 class="sub-block-title">右手武器</h3>
            <p id="right-weapon-hint" class="disabled-hint" style="display:none;"></p>
            <div id="right-weapon-list" class="part-list"></div>
          </div>
        </div>

        <h2 class="panel-title" style="margin-top:22px;">5. 左腕</h2>
        <div id="left-arm-section">
          <p id="left-arm-hint" class="disabled-hint" style="display:none;"></p>
          <div id="left-arm-inner">
            <h3 class="sub-block-title">左腕パーツ</h3>
            <div id="left-arm-list" class="part-list"></div>
          </div>
          <div id="left-weapon-block">
            <h3 class="sub-block-title">左手武器</h3>
            <p id="left-weapon-hint" class="disabled-hint" style="display:none;"></p>
            <div id="left-weapon-list" class="part-list"></div>
          </div>
        </div>

        <h2 class="panel-title" style="margin-top:22px;">6. 右脚</h2>
        <div id="right-leg-list" class="part-list"></div>

        <h2 class="panel-title" style="margin-top:22px;">7. 左脚</h2>
        <div id="left-leg-section">
          <p id="left-leg-hint" class="disabled-hint" style="display:none;"></p>
          <div id="left-leg-list" class="part-list"></div>
        </div>
      </section>

      <!-- 右カラム：ビルドプレビュー・出力（スクロール追従） -->
      <aside class="panel builder-right-sticky">
        <h2 class="panel-title">ビルドプレビュー・出力</h2>

        <div id="rarity-warning" style="display:none;" role="alert"></div>
        <div id="preview-card" class="preview-card"></div>

        <div class="action-bar">
          <button id="save-build-btn" type="button" class="btn btn-primary">保存する</button>
          <button id="save-as-new-btn" type="button" class="btn btn-secondary">別名コピー保存</button>
          <button id="export-json-btn" type="button" class="btn btn-secondary">JSONコピー</button>
          <a href="./arena.html" class="btn btn-secondary">アリーナへ移動 →</a>
        </div>
      </aside>
    </div>
  </main>

  <script type="module" src="./js/builderApp.js?v=12"></script>
</body>
</html>
