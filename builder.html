<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ゴーレムビルダー | ジェネリックハート</title>
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/builder.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-area">
        <div>
          <h1 class="brand-title">ゴーレムビルダー</h1>
          <p class="brand-subtitle">胴体・頭部・腕部・脚部・武装を組み合わせて機体を設計</p>
        </div>
      </div>
      <nav class="nav-links" aria-label="画面切り替え">
        <a class="nav-link" href="./index.html">ポータル</a>
        <a class="nav-link is-active" href="./builder.html">ゴーレムビルダー</a>
        <a class="nav-link" href="./arena.html">ゴーレムアリーナ</a>
      </nav>
    </div>
  </header>

  <main class="page-container">
    <div class="status-bar">
      <div>
        <span id="data-status" class="status-badge is-fallback">「ジェネリックハート_パーツマスター_Ver1.1」読込待機中...</span>
      </div>
      <button id="reload-data-btn" type="button" class="btn btn-secondary btn-sm">
        マスターデータ再読込
      </button>
    </div>

    <div id="master-error" class="panel" style="display:none; border-color:var(--danger); color:#fca5a5; margin-bottom:20px;" role="alert"></div>

    <div class="builder-layout">
      <section class="panel">
        <h2 class="panel-title">1. 基本設定・プリセット</h2>

        <div class="form-row">
          <div>
            <label for="golem-name">機体名</label>
            <input id="golem-name" type="text" maxlength="32" placeholder="機体名を入力" />
          </div>
          <div>
            <label for="tactic-select">さくせん</label>
            <select id="tactic-select"></select>
          </div>
        </div>

        <div class="form-group">
          <label for="preset-select">プリセット機体から読込</label>
          <div style="display:flex;gap:8px;">
            <select id="preset-select"></select>
            <button id="apply-preset-btn" type="button" class="btn btn-secondary">反映</button>
          </div>
        </div>

        <h2 class="panel-title" style="margin-top:20px;">2. 胴体（核）</h2>
        <div id="core-list" class="part-list"></div>

        <h2 class="panel-title" style="margin-top:20px;">3. 頭部</h2>
        <div id="head-list" class="part-list"></div>

        <h2 class="panel-title" style="margin-top:20px;">4. 腕部</h2>
        <div class="form-row" style="margin-bottom:10px;align-items:end;">
          <div>
            <label for="arm-target-select">編集する腕</label>
            <select id="arm-target-select">
              <option value="rightArm">右腕</option>
              <option value="leftArm">左腕</option>
            </select>
          </div>
          <div id="arm-current-summary" class="muted"></div>
        </div>
        <div id="arm-list" class="part-list"></div>

        <h2 class="panel-title" style="margin-top:20px;">5. 脚部</h2>
        <div class="form-row" style="margin-bottom:10px;align-items:end;">
          <div>
            <label for="leg-target-select">編集する脚</label>
            <select id="leg-target-select">
              <option value="rightLeg">右脚</option>
              <option value="leftLeg">左脚</option>
            </select>
          </div>
          <div id="leg-current-summary" class="muted"></div>
        </div>
        <div id="leg-list" class="part-list"></div>

        <h2 class="panel-title" style="margin-top:20px;">6. 武器・シールド</h2>
        <div class="form-row" style="margin-bottom:10px;align-items:end;">
          <div>
            <label for="weapon-target-select">編集する手</label>
            <select id="weapon-target-select">
              <option value="rightWeapon">右手</option>
              <option value="leftWeapon">左手</option>
            </select>
          </div>
          <div id="weapon-current-summary" class="muted"></div>
        </div>
        <div id="weapon-list" class="part-list"></div>
      </section>

      <aside class="panel">
        <h2 class="panel-title">ビルドプレビュー・出力</h2>

        <div id="preview-card" class="preview-card"></div>

        <div class="action-bar">
          <button id="save-build-btn" type="button" class="btn btn-primary">保存する</button>
          <button id="save-as-new-btn" type="button" class="btn btn-secondary">別名コピー保存</button>
          <button id="export-json-btn" type="button" class="btn btn-secondary">JSONコピー</button>
          <a href="./arena.html" class="btn btn-secondary">アリーナへ移動 →</a>
        </div>

        <h3 class="panel-title" style="margin-top:24px;">保存済み機体</h3>
        <div id="saved-list" class="saved-list"></div>
      </aside>
    </div>
  </main>

  <script type="module" src="./js/builderApp.js?v=4"></script>
</body>
</html>
