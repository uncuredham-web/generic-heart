<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ゴーレムアリーナ | ジェネリックハート</title>
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/arena.css" />
  <style>
    .arena-container {
      max-width: 1520px;
      margin: 0 auto;
      padding: 24px 20px 64px;
    }
    .arena-3col {
      display: grid;
      grid-template-columns: minmax(290px, 340px) minmax(0, 1fr) minmax(290px, 340px);
      gap: 20px;
      align-items: start;
    }
    .sticky-side {
      position: -webkit-sticky;
      position: sticky;
      top: 76px;
      align-self: start;
    }
    .fighter-side-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-card);
    }
    .equip-summary {
      margin: 10px 0 12px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.16);
      font-size: 0.84rem;
      line-height: 1.6;
    }
    .equip-row {
      margin-bottom: 3px;
    }
    .equip-row:last-child {
      margin-bottom: 0;
    }
    .center-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .battle-banner {
      margin-bottom: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: #bbf7d0;
    }
    .battle-log {
      padding: 14px 16px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.22);
      min-height: 360px;
      max-height: 68vh;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.87rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .log-line {
      padding: 2px 0;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.08);
    }
    .log-line:last-child {
      border-bottom: none;
    }
    @media (max-width: 1120px) {
      .arena-3col {
        grid-template-columns: 1fr;
      }
      .sticky-side {
        position: static;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-area">
        <div>
          <h1 class="brand-title">ゴーレムアリーナ</h1>
          <p class="brand-subtitle">1on1オートバトル</p>
        </div>
      </div>
      <nav class="nav-links" aria-label="画面切り替え">
        <a class="nav-link" href="./index.html">ポータル</a>
        <a class="nav-link" href="./builder.html">ゴーレムビルダー</a>
        <a class="nav-link is-active" href="./arena.html">ゴーレムアリーナ</a>
      </nav>
    </div>
  </header>

  <main class="arena-container">
    <div class="status-bar">
      <div>
        <span id="data-status" class="status-badge is-fallback">「ジェネリックハート_パーツマスター_Ver1.1」読込待機中...</span>
      </div>
      <div style="display:flex;gap:8px;">
        <a href="./builder.html" class="btn btn-secondary btn-sm">+ 新しい機体を作る</a>
        <button id="reload-data-btn" type="button" class="btn btn-secondary btn-sm">
          マスターデータ再読込
        </button>
      </div>
    </div>

    <div id="master-error" class="panel" style="display:none; border-color:var(--danger); color:#fca5a5; margin-bottom:20px;" role="alert"></div>

    <div class="arena-3col">
      <aside class="fighter-side-card sticky-side">
        <h2 class="panel-title">機体1</h2>
        <div style="margin-bottom:14px;">
          <label for="fighter1-select">機体選択</label>
          <select id="fighter1-select"></select>
        </div>
        <div id="fighter1-card"></div>
      </aside>

      <section class="panel">
        <h2 class="panel-title">バトルフィールド</h2>
        <div class="center-controls">
          <button id="start-battle-btn" type="button" class="btn btn-primary">バトル開始</button>
          <button id="random-battle-btn" type="button" class="btn btn-secondary">ランダム対戦</button>
        </div>
        <div id="battle-banner" class="battle-banner" style="display:none;"></div>
        <div id="battle-log" class="battle-log">
          <span class="muted">左右で対戦するゴーレムを選択し、「バトル開始」を押してください。</span>
        </div>
      </section>

      <aside class="fighter-side-card sticky-side">
        <h2 class="panel-title">機体2</h2>
        <div style="margin-bottom:14px;">
          <label for="fighter2-select">機体選択</label>
          <select id="fighter2-select"></select>
        </div>
        <div id="fighter2-card"></div>
      </aside>
    </div>
  </main>

  <script type="module" src="./js/arenaApp.js?v=7"></script>
</body>
</html>
