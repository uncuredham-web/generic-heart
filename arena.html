<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ゴーレムアリーナ | ジェネリックハート</title>
  <link rel="stylesheet" href="./css/common.css" />
  <link rel="stylesheet" href="./css/arena.css" />
  <style>
    html,
    body,
    .page-container,
    .arena-panel {
      overflow: visible;
    }
    .fighters-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-top: 16px;
      align-items: start;
      overflow: visible;
    }
    .sticky-fighter-card {
      position: -webkit-sticky;
      position: sticky;
      top: 16px;
      z-index: 5;
    }
    .equip-summary {
      margin: 0 0 12px;
      font-size: 0.86rem;
      line-height: 1.55;
    }
    .equip-row {
      margin-bottom: 3px;
    }
    .battle-banner {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 700;
      background: rgba(34, 197, 94, 0.16);
      border: 1px solid rgba(34, 197, 94, 0.45);
      color: #bbf7d0;
    }
    .battle-log {
      margin-top: 12px;
      padding: 14px 16px;
      border-radius: 8px;
      background: rgba(15, 23, 42, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.22);
      max-height: 460px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    .log-line {
      padding: 1px 0;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.08);
    }
    .log-line:last-child {
      border-bottom: none;
    }
    @media (max-width: 820px) {
      .fighters-grid {
        grid-template-columns: 1fr;
      }
      .sticky-fighter-card {
        position: static;
      }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-area">
        <div>
          <h1 class="brand-title">ゴーレムアリーナ</h1>
          <p class="brand-subtitle">1on1オートバトル</p>
        </div>
      </div>
      <nav class="nav-links" aria-label="画面切り替え">
        <a class="nav-link" href="./index.html">ポータル</a>
        <a class="nav-link" href="./builder.html">ゴーレムビルダー</a>
        <a class="nav-link is-active" href="./arena.html">ゴーレムアリーナ</a>
      </nav>
    </div>
  </header>

  <main class="page-container">
    <div class="status-bar">
      <div>
        <span id="data-status" class="status-badge is-fallback">「ジェネリックハート_パーツマスター_Ver1.1」読込待機中...</span>
      </div>
      <div style="display:flex;gap:8px;">
        <a href="./builder.html" class="btn btn-secondary btn-sm">+ 新しい機体を作る</a>
        <button id="reload-data-btn" type="button" class="btn btn-secondary btn-sm">
          マスターデータ再読込
        </button>
      </div>
    </div>

    <div id="master-error" class="panel" style="display:none; border-color:var(--danger); color:#fca5a5; margin-bottom:20px;" role="alert"></div>

    <section class="panel arena-panel">
      <h2 class="panel-title">対戦カード選択</h2>

      <div class="form-row">
        <div>
          <label for="fighter1-select">機体1</label>
          <select id="fighter1-select"></select>
        </div>
        <div>
          <label for="fighter2-select">機体2</label>
          <select id="fighter2-select"></select>
        </div>
      </div>

      <div class="fighters-grid">
        <div id="fighter1-card" class="preview-card sticky-fighter-card"></div>
        <div id="fighter2-card" class="preview-card sticky-fighter-card"></div>
      </div>

      <div class="action-bar" style="margin-top:16px;">
        <button id="start-battle-btn" type="button" class="btn btn-primary">バトル開始</button>
        <button id="random-battle-btn" type="button" class="btn btn-secondary">ランダム対戦</button>
      </div>

      <div id="battle-banner" class="battle-banner" style="display:none;"></div>
      <div id="battle-log" class="battle-log" style="display:none;"></div>
    </section>
  </main>

  <script type="module" src="./js/arenaApp.js?v=5"></script>
</body>
</html>
