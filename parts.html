<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>パーツ一覧 | GENERIC HEART</title>
  <link rel="stylesheet" href="./css/common.css" />
  <style>
    .filter-panel {
      margin-bottom: 20px;
    }

    .filter-group {
      margin-bottom: 14px;
    }

    .filter-group:last-child {
      margin-bottom: 0;
    }

    .filter-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .filter-chip:hover {
      border-color: var(--accent-primary);
    }

    .filter-chip.is-active {
      background: var(--accent-primary);
      color: #082f49;
      border-color: var(--accent-primary);
    }

    .filter-toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: end;
      margin-top: 14px;
    }

    @media (max-width: 640px) {
      .filter-toolbar {
        grid-template-columns: 1fr;
      }
    }

    .result-meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .parts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 14px;
    }

    .part-catalog-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
    }

    .part-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .part-id {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .part-title {
      margin: 2px 0 0;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .badge-group {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .price-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 800;
      background: rgba(250, 204, 21, 0.15);
      color: #fde047;
      border: 1px solid rgba(250, 204, 21, 0.4);
      white-space: nowrap;
    }

    .rarity-badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .rarity-legend {
      background: rgba(245, 158, 11, 0.18);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.45);
    }

    .rarity-rare {
      background: rgba(168, 85, 247, 0.18);
      color: #e9d5ff;
      border: 1px solid rgba(168, 85, 247, 0.45);
    }

    .rarity-uncommon {
      background: rgba(34, 197, 94, 0.16);
      color: #86efac;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .rarity-common {
      background: rgba(148, 163, 184, 0.16);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }

    .part-meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .part-meta-pill {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 2px 8px;
    }

    .part-note {
      margin: 10px 0 0;
      font-size: 0.88rem;
      color: #e2e8f0;
    }

    .part-specs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px;
      font-size: 0.8rem;
    }

    .spec-item {
      display: flex;
      justify-content: space-between;
      gap: 6px;
    }

    .spec-k {
      color: var(--text-muted);
    }

    .spec-v {
      font-weight: 700;
      color: var(--text-main);
    }

    .empty-note {
      margin: 0;
    }
  </style>
</head>

    function formatGold(amount) {
      const n = Math.max(0, Math.round(toFiniteNumber(amount, 0)));
      return `${n.toLocaleString()}G`;
    }

    function rarityClass(rarity) {
      if (rarity === "レジェンド") return "rarity-legend";
      if (rarity === "レア") return "rarity-rare";
      if (rarity === "アンコモン") return "rarity-uncommon";
      return "rarity-common";
    }

    function matchSlotGroup(part, group) {
      if (group === "すべて") return true;
      if (group === "両腕占有") return part.slot === "両腕占有";
      if (group === "両脚占有") return part.slot === "両脚占有";
      if (group === "単枠・片手") return part.slot !== "両腕占有" && part.slot !== "両脚占有";
      return true;
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function renderChips(container, items, currentVal, onSelect) {
      container.innerHTML = items
        .map((item) => {
          const active = item === currentVal;
          const activeClass = active ? " is-active" : "";
          return `<button type="button" class="filter-chip${activeClass}" aria-pressed="${active}" data-val="${escapeHtml(item)}">${escapeHtml(item)}</button>`;
        })
        .join("");

      container.querySelectorAll(".filter-chip").forEach((btn) => {
        btn.addEventListener("click", () => {
          onSelect(btn.dataset.val);
          renderAll();
        });
      });
    }

      const kw = state.keyword.trim().toLowerCase();
      const filtered = state.parts.filter((p) => {
        if (state.rarity !== "すべて" && p.rarity !== state.rarity) return false;
        if (state.cat !== "すべて" && p.cat !== state.cat) return false;
        if (!matchSlotGroup(p, state.slotGroup)) return false;
        if (kw) {
          const priceText = formatGold(p.price).toLowerCase();
          const hay = `${p.id} ${p.cat} ${p.rarity} ${p.name} ${p.slot} ${p.range} ${p.note} ${p.price} ${priceText}`.toLowerCase();
          if (!hay.includes(kw)) return false;
        }
        return true;
      });

      countEl.textContent = `表示中：${filtered.length}件 / 全${state.parts.length}件`;

      if (filtered.length === 0) {
        gridEl.innerHTML = `<div class="panel"><p class="muted empty-note">条件に一致するパーツはありません。</p></div>`;
        return;
      }

      gridEl.innerHTML = filtered
        .map((p) => {
          const regenStr = p.mpRegen > 0 ? `+${p.mpRegen}` : `${p.mpRegen}`;
          const accStr = p.acc > 0 ? `+${p.acc}%` : `${p.acc}%`;
          const evadeStr = p.evade > 0 ? `+${p.evade}%` : `${p.evade}%`;
          return `
            <article class="part-catalog-card">
              <div>
                <div class="part-top">
                  <div>
                    <div class="part-id">${escapeHtml(p.id)}</div>
                    <h3 class="part-title">${escapeHtml(p.name)}</h3>
                  </div>
                  <div class="badge-group">
                    <span class="price-badge">${escapeHtml(formatGold(p.price))}</span>
                    <span class="rarity-badge ${rarityClass(p.rarity)}">${escapeHtml(p.rarity)}</span>
                  </div>
                </div>
                <div class="part-meta-line">
                  <span class="part-meta-pill">${escapeHtml(p.cat)}</span>
                  <span class="part-meta-pill">${escapeHtml(p.slot)}</span>
                  <span class="part-meta-pill">価格 ${escapeHtml(formatGold(p.price))}</span>
                  <span class="part-meta-pill">コスト ${escapeHtml(p.baseCost)}</span>
                  <span class="part-meta-pill">射程 ${escapeHtml(p.range)}</span>
                </div>
                <p class="part-note">${escapeHtml(p.note)}</p>
              </div>
              <div class="part-specs">
                <div class="spec-item"><span class="spec-k">価格</span><span class="spec-v">${escapeHtml(formatGold(p.price))}</span></div>
                <div class="spec-item"><span class="spec-k">耐久/HP</span><span class="spec-v">${p.hp}</span></div>
                <div class="spec-item"><span class="spec-k">威力</span><span class="spec-v">${p.power}</span></div>
                <div class="spec-item"><span class="spec-k">最大MP / 回復</span><span class="spec-v">${p.maxMp} / ${regenStr}</span></div>
                <div class="spec-item"><span class="spec-k">消費MP</span><span class="spec-v">${p.useCost}</span></div>
                <div class="spec-item"><span class="spec-k">命中 / 移動</span><span class="spec-v">${accStr} / ${p.move}</span></div>
                <div class="spec-item"><span class="spec-k">回避</span><span class="spec-v">${evadeStr}</span></div>
              </div>
            </article>
          `;
        })
        .join("");
    }

    function renderAll() {
      renderChips(rarityEl, RARITIES, state.rarity, (v) => { state.rarity = v; });
      renderChips(catEl, CATEGORIES, state.cat, (v) => { state.cat = v; });
      renderChips(slotEl, SLOT_FILTERS, state.slotGroup, (v) => { state.slotGroup = v; });
      renderParts();
    }

    searchEl.addEventListener("input", (e) => {
      state.keyword = e.target.value;
      renderParts();
    });

    resetBtn.addEventListener("click", () => {
      state.rarity = "すべて";
      state.cat = "すべて";
      state.slotGroup = "すべて";
      state.keyword = "";
      searchEl.value = "";
      renderAll();
    });

    renderAll();

    loadGolemMasterData().then((res) => {
      if (res && res.ok && Array.isArray(res.data?.parts) && res.data.parts.length > 0) {
        state.parts = res.data.parts;
        renderParts();
      }
    }).catch(() => {});
  </script>
</body>
</html>
